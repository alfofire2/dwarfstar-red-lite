[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwarfstar-red-lite"
version = "0.3.0.dev9"
description = "Apple-Silicon-first native runtime and validation tools for Qwen3-Next MoE inference"
requires-python = ">=3.10"
authors = [{name = "DwarfStar Red Lite contributors"}]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
redlite = "redlite.cli:main"
redlite-stream = "redlite.stream_cli:main"
redlite-ffn = "redlite.ffn_cli:main"
redlite-topk = "redlite.topk_cli:main"

[tool.setuptools]
packages = ["redlite"]
