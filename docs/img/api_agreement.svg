<rect x="340" y="38" width="12" height="12" fill="#3b7dd8"/><text class="l" x="357" y="48">median share of words matching from the start</text>
<text class="l" x="222" y="98" text-anchor="end">IQ2_XXS (17.97 GiB)</text>
<rect x="230" y="76" width="27.1" height="15" rx="2" fill="#d64545"/><text class="v" x="262.1" y="88">0.9</text>
<rect x="230" y="94" width="235.0" height="15" rx="2" fill="#3b7dd8"/><text class="v" x="470.0" y="106">7.8</text>
<text class="l" x="222" y="144" text-anchor="end">IQ3_XXS (29.55 GiB)</text>
<rect x="230" y="122" width="129.6" height="15" rx="2" fill="#d64545"/><text class="v" x="364.6" y="134">4.3</text>
<rect x="230" y="140" width="470.0" height="15" rx="2" fill="#3b7dd8"/><text class="v" x="705.0" y="152">15.6</text>
<text class="n" x="10" y="207">%. Word for word against Alibaba Cloud&#x27;s qwen3-next-80b-a3b-instruct (temperature 0, top_k 1, 128 tokens). Same engine for</text>
