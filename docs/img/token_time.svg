<svg xmlns="http://www.w3.org/2000/svg" width="810" height="402" viewBox="0 0 810 402">
<style>.bg{fill:#ffffff}text{font-family:-apple-system,Helvetica,Arial,sans-serif;fill:#24292f}.t{font-size:15px;font-weight:600}.n{font-size:11px;fill:#57606a}.l{font-size:12px}.v{font-size:12px;font-weight:600}.g{stroke:#d0d7de}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}text{fill:#e6edf3}.n{fill:#8d96a0}.g{stroke:#30363d}}</style>
<rect class="bg" width="810" height="402"/>
<text class="t" x="10" y="24">Where one decode token&#x27;s GPU time goes (M4 Max, IQ2_XXS, dev38)</text>
<text class="l" x="222" y="71" text-anchor="end">routed experts</text>
<rect x="230" y="58" width="470.0" height="15" rx="2" fill="#d64545"/><text class="v" x="705.0" y="70">4.071</text>
<text class="l" x="222" y="99" text-anchor="end">DeltaNet projections</text>
<rect x="230" y="86" width="201.8" height="15" rx="2" fill="#d64545"/><text class="v" x="436.8" y="98">1.748</text>
<text class="l" x="222" y="127" text-anchor="end">shared expert</text>
<rect x="230" y="114" width="123.6" height="15" rx="2" fill="#d64545"/><text class="v" x="358.6" y="126">1.071</text>
<text class="l" x="222" y="155" text-anchor="end">DeltaNet tail</text>
<rect x="230" y="142" width="102.8" height="15" rx="2" fill="#d64545"/><text class="v" x="337.8" y="154">0.89</text>
<text class="l" x="222" y="183" text-anchor="end">DeltaNet state</text>
<rect x="230" y="170" width="67.3" height="15" rx="2" fill="#d64545"/><text class="v" x="302.3" y="182">0.583</text>
<text class="l" x="222" y="211" text-anchor="end">output head</text>
<rect x="230" y="198" width="65.5" height="15" rx="2" fill="#d64545"/><text class="v" x="300.5" y="210">0.567</text>
<text class="l" x="222" y="239" text-anchor="end">attention</text>
<rect x="230" y="226" width="63.6" height="15" rx="2" fill="#d64545"/><text class="v" x="298.6" y="238">0.551</text>
<text class="l" x="222" y="267" text-anchor="end">router</text>
<rect x="230" y="254" width="59.1" height="15" rx="2" fill="#d64545"/><text class="v" x="294.1" y="266">0.512</text>
<text class="l" x="222" y="295" text-anchor="end">attention projections</text>
<rect x="230" y="282" width="56.3" height="15" rx="2" fill="#d64545"/><text class="v" x="291.3" y="294">0.488</text>
<text class="l" x="222" y="323" text-anchor="end">norms, residuals, small steps</text>
<rect x="230" y="310" width="172.7" height="15" rx="2" fill="#d64545"/><text class="v" x="407.7" y="322">1.496</text>
<text class="n" x="10" y="377">ms. RL_ENGINE_PROFILE=1, every expert resident, each stage timed on its own (sum 12.0 ms). A real token takes 12.1 ms wall,</text>
<text class="n" x="10" y="392">11.7 ms of GPU.</text>
