name: CI

# Model-free checks on Linux for every push and pull request (dev28). Metal and the real-model
# parity suite cannot run on hosted runners: they are covered by scripts/regress_m4.sh on the
# local Apple Silicon machine and by the manual self-hosted mac-m4-field-validation workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / native + sanitize + tests + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Ruff (fatal errors)
        run: ruff check redlite tests --select E9,F63,F7,F82 --output-format=github

      - name: Compile Python sources
        run: python -m compileall -q redlite tests scripts

      - name: make native (portable subset, warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          make native 2>&1 | tee native.log
          if grep -n 'warning:' native.log; then echo "::error::compiler warnings in make native"; exit 1; fi

      - name: make sanitize (ASan + UBSan, model-free tests, GGUF fuzz, server protocol tests)
        shell: bash
        run: |
          set -o pipefail
          make sanitize 2>&1 | tee sanitize.log
          if grep -n 'warning:' sanitize.log; then echo "::error::compiler warnings in make sanitize"; exit 1; fi

      - name: make test
        run: make test
