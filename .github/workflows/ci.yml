name: CI

on:
  push:
    branches:
      - main
      - v0.3-streaming
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Red Lite
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q redlite tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Red Metal bridge
        if: runner.os == 'macOS'
        run: make redmetal

      - name: Smoke-test CLI
        shell: bash
        run: |
          redlite --version
          redlite-stream --help

      - name: Import streaming modules
        run: |
          python - <<'PY'
          from redlite.expert_cache import ExpertSlotCache
          from redlite.expert_store import ExpertStore, build_expert_layouts
          from redlite.expert_map import build_expert_map
          from redlite.streaming import make_streaming_plan
          from redlite.redmetal import redmetal_library_path
          from redlite.redmetal_cache import MetalExpertCache
          from redlite.redmetal_exec import RedMetalExecPool
          from redlite.redmetal_exec_cache import ExecMetalExpertCache
          from redlite.redmetal_parity import quant_parity_probe
          from redlite.redmetal_quant import RedMetalQuantBridge
          from redlite.quant_reference import quant_row_dot, row_bytes_for_type
          from redlite.quant_tables import SUPPORTED_ROUTED_TYPES, quant_type_name
          print("streaming imports: OK")
          print("routed quant types:", SUPPORTED_ROUTED_TYPES)
          print("redmetal library path:", redmetal_library_path())
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dwarfstar-red-lite-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
