name: CI

on:
  push:
    branches:
      - main
      - v0.3-streaming
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Red Lite
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q redlite tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI
        shell: bash
        run: |
          redlite --version
          redlite-stream --help

      - name: Import streaming modules
        run: |
          python - <<'PY'
          from redlite.expert_cache import MmapExpertCache
          from redlite.expert_map import build_expert_map
          from redlite.streaming import make_streaming_plan
          print("streaming imports: OK")
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dwarfstar-red-lite-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
