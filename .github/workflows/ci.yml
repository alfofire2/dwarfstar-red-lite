name: CI

# Model-free checks for every push and pull request (dev28; removed 2026-10-03 while hosted runners were paid,
# restored when the repository went public). The real-model parity suite cannot run on hosted runners: it is
# scripts/regress_m4.sh on a local Apple Silicon Mac. The macOS job runs scripts/dev/local_ci.sh: the same steps,
# plus the Metal builds and their model-free self-tests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / native + sanitize + tests + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Ruff (fatal errors)
        run: ruff check redlite tests --select E9,F63,F7,F82 --output-format=github

      - name: Compile Python sources
        run: python -m compileall -q redlite tests scripts

      - name: make native (portable subset, warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          make native 2>&1 | tee native.log
          if grep -n 'warning:' native.log; then echo "::error::compiler warnings in make native"; exit 1; fi

      - name: make sanitize (ASan + UBSan, model-free tests, GGUF fuzz, server protocol tests)
        shell: bash
        run: |
          set -o pipefail
          make sanitize 2>&1 | tee sanitize.log
          if grep -n 'warning:' sanitize.log; then echo "::error::compiler warnings in make sanitize"; exit 1; fi

      - name: make test
        run: make test

  macos:
    name: macOS / local_ci.sh (Metal builds + self-tests)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: scripts/dev/local_ci.sh
        shell: bash
        run: |
          bash scripts/dev/local_ci.sh || { for f in "${TMPDIR:-/tmp}"/redlite-local-ci/*.log; do echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"; done; exit 1; }
