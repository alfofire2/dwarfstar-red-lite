name: Lint

on:
  push:
    branches:
      - main
      - v0.3-streaming
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Check fatal Python errors
        run: ruff check redlite tests --select E9,F63,F7,F82 --output-format=github

      - name: Check imports compile cleanly
        run: python -m compileall -q redlite tests
