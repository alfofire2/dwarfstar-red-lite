name: Red Lite M4 Field Validation

on:
  push:
    branches:
      - v0.3-streaming
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redlite-m4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-field-validation:
    name: M4 Pro 24GB field validation
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      REDLITE_MODEL_PATH: ${{ vars.REDLITE_MODEL_PATH }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify runner and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            uname -a
            sw_vers
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl -n hw.memsize 2>/dev/null || true
          } | tee artifacts/runner-info.log
          if [[ -z "${REDLITE_MODEL_PATH:-}" ]]; then echo "Repository variable REDLITE_MODEL_PATH is not configured." >&2; exit 2; fi
          if [[ ! -f "$REDLITE_MODEL_PATH" ]]; then echo "Model not found at REDLITE_MODEL_PATH=$REDLITE_MODEL_PATH" >&2; exit 2; fi
          {
            echo "model_path=$REDLITE_MODEL_PATH"
            stat -f 'model_bytes=%z' "$REDLITE_MODEL_PATH"
            du -h "$REDLITE_MODEL_PATH"
          } | tee artifacts/model-info.log

      - name: Build native runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          make native 2>&1 | tee artifacts/make-native.log

      - name: Full-attention tensor audit current milestone
        id: full_attn_audit
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-layer-audit "$REDLITE_MODEL_PATH" --tensors 2>&1 | tee artifacts/layer-audit-tensors.log

      - name: Complete full-attention regression
        id: full_attention
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-attention parity "$REDLITE_MODEL_PATH" --layer 3 --position 0 2>&1 | tee artifacts/full-attention-layer3-context1.log
          .deps/redmetal/redlite-attention parity "$REDLITE_MODEL_PATH" --layer 3 --position 1 2>&1 | tee artifacts/full-attention-layer3-context2.log
          .deps/redmetal/redlite-attention parity "$REDLITE_MODEL_PATH" --layer 3 --position 15 2>&1 | tee artifacts/full-attention-layer3-context16.log

      - name: Complete full-attention transformer block regression
        id: full_attention_block
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-attention-block parity "$REDLITE_MODEL_PATH" --layer 3 --position 7 --top-k 10 --cache-mib 256 2>&1 | tee artifacts/full-attention-block-layer3.log

      - name: DeltaNet projection regression
        id: projection
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-deltanet-proj parity "$REDLITE_MODEL_PATH" --layer 0 --rows 8 2>&1 | tee artifacts/deltanet-proj-layer0.log

      - name: DeltaNet prestate regression
        id: prestate
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-deltanet-prestate parity "$REDLITE_MODEL_PATH" --layer 0 2>&1 | tee artifacts/deltanet-prestate-layer0.log

      - name: DeltaNet recurrent-state regression
        id: state
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-deltanet-state parity "$REDLITE_MODEL_PATH" --layer 0 2>&1 | tee artifacts/deltanet-state-layer0.log

      - name: DeltaNet gated tail regression
        id: tail
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-deltanet-tail parity "$REDLITE_MODEL_PATH" --layer 0 2>&1 | tee artifacts/deltanet-tail-layer0.log

      - name: Complete DeltaNet layer regression
        id: deltanet_layer
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-deltanet-layer parity "$REDLITE_MODEL_PATH" --layer 0 2>&1 | tee artifacts/deltanet-layer0.log

      - name: Complete recurrent transformer block regression
        id: recurrent_block
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-recurrent-block parity "$REDLITE_MODEL_PATH" --layer 0 --top-k 10 --cache-mib 256 2>&1 | tee artifacts/recurrent-block-layer0.log

      - name: Complete FFN regression layer 0
        id: ffn0
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-ffn parity "$REDLITE_MODEL_PATH" --layer 0 --top-k 10 --rows 8 --cache-mib 256 2>&1 | tee artifacts/ffn-layer0.log

      - name: Full-width FFN layer 0 regression
        id: ffn0_full
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-ffn parity "$REDLITE_MODEL_PATH" --layer 0 --top-k 10 --rows 2048 --cache-mib 256 2>&1 | tee artifacts/ffn-layer0-full.log

      - name: Complete FFN regression layer 6
        id: ffn6
        shell: bash
        run: |
          set -euo pipefail
          .deps/redmetal/redlite-ffn parity "$REDLITE_MODEL_PATH" --layer 6 --top-k 10 --rows 8 --cache-mib 256 2>&1 | tee artifacts/ffn-layer6.log

      - name: Write diagnostics summary
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/diagnostics.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "runner": "${RUNNER_NAME:-unknown}",
            "os": "${RUNNER_OS:-unknown}",
            "arch": "${RUNNER_ARCH:-unknown}",
            "build": "${{ steps.build.outcome }}",
            "full_attn_audit": "${{ steps.full_attn_audit.outcome }}",
            "full_attention": "${{ steps.full_attention.outcome }}",
            "full_attention_block": "${{ steps.full_attention_block.outcome }}",
            "deltanet_projection": "${{ steps.projection.outcome }}",
            "deltanet_prestate": "${{ steps.prestate.outcome }}",
            "deltanet_state": "${{ steps.state.outcome }}",
            "deltanet_tail": "${{ steps.tail.outcome }}",
            "deltanet_layer": "${{ steps.deltanet_layer.outcome }}",
            "recurrent_block": "${{ steps.recurrent_block.outcome }}",
            "ffn_layer_0": "${{ steps.ffn0.outcome }}",
            "ffn_layer_0_full": "${{ steps.ffn0_full.outcome }}",
            "ffn_layer_6": "${{ steps.ffn6.outcome }}"
          }
          JSON
          cat artifacts/diagnostics.json

      - name: Upload M4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redlite-m4-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
